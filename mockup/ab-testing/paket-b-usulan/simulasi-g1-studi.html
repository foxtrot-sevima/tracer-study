<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabang Melanjutkan Pendidikan — Wave G1</title>
    <link rel="icon" href="../../../../karir_prompt/slicing-karirlink-v2/assets/images/logo/karirlink-colored-square.webp">
    <link rel="stylesheet" href="../../../../karir_prompt/slicing-karirlink-v2/vendors/quantum-v2.2.1-202310260001/assets/release/qn-202310260001.css">
    <link rel="stylesheet" href="../../../../karir_prompt/slicing-karirlink-v2/assets/css/main.css">
    <link rel="stylesheet" href="../../quantum/assets/css/main.css">
    <style>
        .stepper{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--qn-neutral-200);padding:.6rem 0;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:center;gap:.4rem;font-size:.72rem;}
        .stepper__item{padding:.3rem .7rem;border-radius:.25rem;color:var(--qn-neutral-400);}
        .stepper__item.is-active{background:var(--qn-primary-500);color:#fff;font-weight:600;}
        .stepper__item.is-done{color:var(--qn-primary-500);font-weight:500;}
        .stepper__sep{color:var(--qn-neutral-300);}
        select{appearance:menulist !important;}
    </style>
</head>
<body class="body body_kl-white">

<div class="stepper">
    <span class="stepper__item is-done">Informasi Umum</span>
    <span class="stepper__sep">→</span>
    <span class="stepper__item is-active">Melanjutkan Pendidikan</span>
    <span class="stepper__sep">→</span>
    <span class="stepper__item">Kompetensi</span>
</div>

<div style="max-width:640px;margin:0 auto;padding:0 1rem 3rem;">

    <a href="simulasi-g1-status.html" style="display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--qn-primary-500);text-decoration:none;margin-bottom:1rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Kembali ke Informasi Umum
    </a>

    <!-- Header -->
    <div style="text-align:center;margin-bottom:1.5rem;">
        <img src="../../../../karir_prompt/slicing-karirlink-v2/assets/images/logo/karirlink-colored.webp" alt="KarirLink" height="36" style="margin-bottom:.5rem;">
        <h2 style="margin:0;font-size:1.1rem;">Tracer Study — Universitas Foxtrot</h2>
        <p style="margin:.25rem 0 0;font-size:.8rem;color:var(--qn-neutral-500);">Wave G1</p>
    </div>

    <!-- f18a: Sumber biaya studi lanjut -->
    <div class="form-control" style="margin-bottom:1.5rem;">
        <label class="form-control__label">1. Sumber biaya untuk studi lanjut <span class="important">*</span></label>
        <div class="form-control__group">
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f18a"><label class="form-control__label-radio">Biaya Sendiri</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f18a"><label class="form-control__label-radio">Beasiswa</label></div>
        </div>
    </div>

    <!-- f18b: Perguruan Tinggi -->
    <div class="form-control" style="margin-bottom:1.5rem;">
        <label class="form-control__label">2. Perguruan Tinggi tujuan studi lanjut <span class="important">*</span></label>
        <input type="text" class="form-control__input" placeholder="Nama perguruan tinggi">
    </div>

    <!-- f18c: Program Studi -->
    <div class="form-control" style="margin-bottom:1.5rem;">
        <label class="form-control__label">3. Program Studi <span class="important">*</span></label>
        <input type="text" class="form-control__input" placeholder="Nama program studi">
    </div>

    <!-- f18d: Tanggal Masuk -->
    <div class="form-control" style="margin-bottom:1.5rem;">
        <label class="form-control__label">4. Tanggal masuk studi lanjut <span class="important">*</span></label>
        <input type="date" class="form-control__input">
    </div>

    <!-- f14: Keeratan bidang studi -->
    <div class="form-control" style="margin-bottom:1.5rem;">
        <label class="form-control__label">5. Seberapa erat hubungan antara bidang studi lanjut dengan pendidikan Anda sebelumnya? <span class="important">*</span></label>
        <p style="font-size:.72rem;color:var(--qn-neutral-400);margin:0 0 .5rem;font-style:italic;">Redaksi: "dengan pendidikan Anda" (bukan "pekerjaan")</p>
        <div class="form-control__group">
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f14"><label class="form-control__label-radio">Sangat Erat</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f14"><label class="form-control__label-radio">Erat</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f14"><label class="form-control__label-radio">Cukup Erat</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f14"><label class="form-control__label-radio">Kurang Erat</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f14"><label class="form-control__label-radio">Tidak Sama Sekali</label></div>
        </div>
    </div>

    <!-- Bottom nav -->
    <div style="display:flex;justify-content:space-between;padding-top:1rem;border-top:1px solid var(--qn-neutral-200);">
        <a href="simulasi-g1-status.html" class="btn btn_outline">← Kembali</a>
        <a href="simulasi-g1-kompetensi.html" class="btn btn_primary">Lanjut →</a>
    </div>

</div>

</body>
</html>
