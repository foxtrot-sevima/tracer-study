<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabang Wiraswasta — Wave G1</title>
    <link rel="icon" href="../../../../karir_prompt/slicing-karirlink-v2/assets/images/logo/karirlink-colored-square.webp">
    <link rel="stylesheet" href="../../../../karir_prompt/slicing-karirlink-v2/vendors/quantum-v2.2.1-202310260001/assets/release/qn-202310260001.css">
    <link rel="stylesheet" href="../../../../karir_prompt/slicing-karirlink-v2/assets/css/main.css">
    <link rel="stylesheet" href="../../quantum/assets/css/main.css">
    <style>
        .stepper{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--qn-neutral-200);padding:.6rem 0;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:center;gap:.4rem;font-size:.72rem;}
        .stepper__item{padding:.3rem .7rem;border-radius:.25rem;color:var(--qn-neutral-400);}
        .stepper__item.is-active{background:var(--qn-primary-500);color:#fff;font-weight:600;}
        .stepper__item.is-done{color:var(--qn-primary-500);font-weight:500;}
        .stepper__sep{color:var(--qn-neutral-300);}
        select{appearance:menulist !important;}
    </style>
</head>
<body class="body body_kl-white">

<div class="stepper">
    <span class="stepper__item is-done">Informasi Umum</span>
    <span class="stepper__sep">→</span>
    <span class="stepper__item is-active">Wiraswasta</span>
    <span class="stepper__sep">→</span>
    <span class="stepper__item">Kompetensi</span>
</div>

<div style="max-width:640px;margin:0 auto;padding:0 1rem 3rem;">

    <a href="simulasi-g1-status.html" style="display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--qn-primary-500);text-decoration:none;margin-bottom:1rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Kembali ke Informasi Umum
    </a>

    <!-- Header -->
    <div style="text-align:center;margin-bottom:1.5rem;">
        <img src="../../../../karir_prompt/slicing-karirlink-v2/assets/images/logo/karirlink-colored.webp" alt="KarirLink" height="36" style="margin-bottom:.5rem;">
        <h2 style="margin:0;font-size:1.1rem;">Tracer Study — Universitas Foxtrot</h2>
        <p style="margin:.25rem 0 0;font-size:.8rem;color:var(--qn-neutral-500);">Wave G1</p>
    </div>

    <!-- f5c: Posisi/jabatan -->
    <div class="form-control" style="margin-bottom:1.5rem;">
        <label class="form-control__label">1. Apa posisi/jabatan Anda saat ini? <span class="important">*</span></label>
        <div class="form-control__group">
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f5c"><label class="form-control__label-radio">Founder</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f5c"><label class="form-control__label-radio">Co-Founder</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f5c"><label class="form-control__label-radio">Staff</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f5c"><label class="form-control__label-radio">Freelance/Kerja Lepas</label></div>
        </div>
    </div>

    <!-- f1101: Jenis usaha -->
    <div class="form-control" style="margin-bottom:1.5rem;">
        <label class="form-control__label">2. Apa jenis instansi/organisasi tempat Anda berwirausaha? <span class="important">*</span></label>
        <div class="form-control__group">
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f1101"><label class="form-control__label-radio">Instansi pemerintah</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f1101"><label class="form-control__label-radio">BUMN/BUMD</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f1101"><label class="form-control__label-radio">Institusi/Organisasi Multilateral</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f1101"><label class="form-control__label-radio">Organisasi non-profit/LSM</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f1101"><label class="form-control__label-radio">Perusahaan swasta</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f1101"><label class="form-control__label-radio">Wiraswasta/perusahaan sendiri</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f1101"><label class="form-control__label-radio">Lainnya</label></div>
            <input type="text" class="form-control__input" placeholder="Sebutkan jenis usaha lainnya..." style="margin-top:.25rem;">
        </div>
    </div>

    <!-- f5d: Tingkat usaha -->
    <div class="form-control" style="margin-bottom:1.5rem;">
        <label class="form-control__label">3. Apa tingkat usaha Anda? <span class="important">*</span></label>
        <div class="form-control__group">
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f5d"><label class="form-control__label-radio">Lokal/wilayah/wiraswasta tidak berbadan hukum</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f5d"><label class="form-control__label-radio">Nasional/wiraswasta berbadan hukum</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f5d"><label class="form-control__label-radio">Multinasional/internasional</label></div>
        </div>
    </div>

    <!-- f5a1: Provinsi -->
    <div class="form-control" style="margin-bottom:1.5rem;">
        <label class="form-control__label">4. Provinsi tempat usaha Anda <span class="important">*</span></label>
        <select class="form-control__input">
            <option value="">— Pilih provinsi —</option>
            <option>Prov. Jawa Timur</option>
            <option>Prov. D.K.I. Jakarta</option>
            <option>Prov. Jawa Barat</option>
            <option>Prov. Jawa Tengah</option>
            <option>Prov. Bali</option>
            <option>Luar Negeri</option>
        </select>
    </div>

    <!-- f5a2: Kab/Kota -->
    <div class="form-control" style="margin-bottom:1.5rem;">
        <label class="form-control__label">5. Kabupaten/Kota tempat usaha Anda <span class="important">*</span></label>
        <select class="form-control__input">
            <option value="">— Pilih kab/kota —</option>
            <option>Kota Surabaya</option>
            <option>Kota Malang</option>
            <option>Kab. Sidoarjo</option>
            <option>Kota Jakarta Selatan</option>
            <option>Kota Bandung</option>
        </select>
    </div>

    <!-- f5b: Nama usaha -->
    <div class="form-control" style="margin-bottom:1.5rem;">
        <label class="form-control__label">6. Nama usaha/tempat berwirausaha Anda <span class="important">*</span></label>
        <input type="text" class="form-control__input" placeholder="Nama usaha Anda">
    </div>

    <!-- f505: Pendapatan -->
    <div class="form-control" style="margin-bottom:1.5rem;">
        <label class="form-control__label">7. Berapa rata-rata pendapatan Anda per bulan? <span class="important">*</span></label>
        <div style="display:flex;align-items:center;gap:.5rem;">
            <span style="font-weight:600;">Rp</span>
            <input type="text" class="form-control__input" inputmode="numeric" placeholder="0" style="flex:1;">
        </div>
    </div>

    <!-- f14: Keeratan -->
    <div class="form-control" style="margin-bottom:1.5rem;">
        <label class="form-control__label">8. Seberapa erat hubungan antara bidang studi dengan usaha Anda? <span class="important">*</span></label>
        <div class="form-control__group">
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f14"><label class="form-control__label-radio">Sangat Erat</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f14"><label class="form-control__label-radio">Erat</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f14"><label class="form-control__label-radio">Cukup Erat</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f14"><label class="form-control__label-radio">Kurang Erat</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f14"><label class="form-control__label-radio">Tidak Sama Sekali</label></div>
        </div>
    </div>

    <!-- f15: Jenjang -->
    <div class="form-control" style="margin-bottom:1.5rem;">
        <label class="form-control__label">9. Tingkat pendidikan apa yang paling tepat/sesuai untuk usaha Anda saat ini? <span class="important">*</span></label>
        <div class="form-control__group">
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f15"><label class="form-control__label-radio">Setingkat Lebih Tinggi</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f15"><label class="form-control__label-radio">Tingkat yang Sama</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f15"><label class="form-control__label-radio">Setingkat Lebih Rendah</label></div>
            <div class="radio-button"><input type="radio" class="form-control__radio" name="f15"><label class="form-control__label-radio">Tidak Perlu Pendidikan Tinggi</label></div>
        </div>
    </div>

    <!-- Bottom nav -->
    <div style="display:flex;justify-content:space-between;padding-top:1rem;border-top:1px solid var(--qn-neutral-200);">
        <a href="simulasi-g1-status.html" class="btn btn_outline">← Kembali</a>
        <a href="simulasi-g1-kompetensi.html" class="btn btn_primary">Lanjut →</a>
    </div>

</div>

</body>
</html>
