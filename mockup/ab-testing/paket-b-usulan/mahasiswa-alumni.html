    <script>
        const rows=[
            ['Ahmad Rizki','S1 Teknik Informatika','Diterima · PT Telkom','tag_success','G1 selesai'],

            ['Budi Santoso','S1 Akuntansi','Diterima · BCA','tag_success','Exit selesai'],
            ['Dewi Lestari','S1 Manajemen','Wirausaha','tag_neutral','G2 selesai'],
            ['Fajar Nugroho','S1 Teknik Informatika','Mencari kerja','tag_neutral','Belum isi'],
        ];
        document.getElementById('rows').innerHTML=rows.map(([n,p,k,tag,t])=>`
            <tr><td><b>${n}</b></td><td>${p}</td><td><span class="tag ${tag}">${k}</span></td><td>${t}</td><td style="text-align:right;"><a href="alumni-detail.html" class="link link_primary">Detail</a></td></tr>`).join('');
    </script>
