            </div>
            <div class="hidden lg:flex items-center space-x-6">
                <a href="company-beranda.html" class="flex items-center text-sm text-gray-600 hover:text-primary500 font-medium gap-1.5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Beranda
                </a>
                <a href="company-lowongan.html" class="flex items-center text-sm text-primary500 font-semibold gap-1.5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>

                    Talent

                <div class="relative" id="kerjaSamaDropdownWrapper">
                    <button onclick="toggleKerjaSama()" class="flex items-center text-sm text-gray-600 hover:text-primary500 font-medium gap-1.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>

                    </button>
                    <div id="kerjaSamaDropdown" class="hidden absolute top-full left-0 mt-2 bg-white border border-gray-200 rounded-lg shadow-lg py-1 z-40 min-w-[180px]">
                        <a href="company-pencarian-mitra.html" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-100">Pencarian Mitra</a>
                        <a href="company-daftar-mitra.html" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-100">Daftar Mitra</a>
                        <a href="company-kegiatan-kerja-sama.html" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-100">Kegiatan Kerja Sama</a>

    <!-- Main -->
    <main class="pt-20 px-4 lg:px-8 xl:px-24 max-w-screen-xl mx-auto pb-8">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8 mt-4">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-semibold text-gray-900">Lowongan</h1>
                <span class="text-xs font-medium text-primary500 border border-primary500 rounded-full px-3 py-1">Kuota Posting Lowongan Tersisa <span class="bg-red-500 text-white rounded-full px-1.5 py-0.5 ml-1 text-[10px]">2</span></span>
            </div>
            <a href="company-lowongan-create.html" class="bg-primary500 hover:bg-primary600 text-white text-sm font-semibold py-2.5 px-5 rounded-lg">Buat Lowongan</a>
        </div>

        <!-- Empty State -->
        <div class="bg-white rounded-lg shadow-sm py-24 text-center">
            <svg class="w-32 h-32 mx-auto mb-6 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            <h2 class="text-xl font-bold text-gray-900 mb-2">Belum Ada Lowongan Tersedia</h2>
            <p class="text-sm text-gray-500">Saat ini belum ada lowongan yang tersedia.<br>Silakan <a href="company-lowongan-create.html" class="text-primary500 underline font-medium">buat lowongan baru.</a></p>
        </div>
    </main>
    <script>
        function toggleKerjaSama() {
            document.getElementById('kerjaSamaDropdown').classList.toggle('hidden');
        }
        document.addEventListener('click', function(e) {
            var wrapper = document.getElementById('kerjaSamaDropdownWrapper');
            var dropdown = document.getElementById('kerjaSamaDropdown');
            if (wrapper && !wrapper.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
