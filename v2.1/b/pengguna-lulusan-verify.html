    <!-- Karirlink CSS -->

    <link rel="stylesheet" href="assets/css/main.css">

    <style>
        body { background: var(--qn-neutral-100); display: flex; flex-direction: column; min-height: 100vh; }

        /* Public tracer-study branding bar (page-local: no Quantum equivalent for this unauthenticated portal header) */
        .ts-header { position: sticky; top: 0; z-index: 50; background: white; border-bottom: 1px solid var(--qn-neutral-200); padding: 0.75rem 1rem; }
        .ts-header__inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
        .ts-header__left { display: flex; align-items: center; gap: 0.75rem; }
        .ts-header__logo { width: 3rem; height: 3rem; border-radius: 50%; border: 1px solid var(--qn-neutral-200); object-fit: cover; }
        .ts-header__info p { margin: 0; }
        .ts-header__info p:first-child { font-size: 0.875rem; color: var(--qn-neutral-500); }
        .ts-header__info p:last-child { font-weight: 500; color: var(--qn-neutral-800); }

        /* Main */
        .ts-main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 2.5rem 1rem; }

        /* Illustration placeholder (decorative, no Quantum equivalent needed) */
        .verify-illust { display: block; margin: 0 auto 1.5rem; width: 10rem; height: auto; }

        /* Text */
        .verify-title { font-size: 1.125rem; font-weight: 600; color: var(--qn-neutral-800); text-align: center; margin-bottom: 0.5rem; }
        .verify-desc { font-size: 0.875rem; color: var(--qn-neutral-500); text-align: center; line-height: 1.5; margin-bottom: 1.5rem; }

        /* Read-only identity summary - same pattern as pengguna-lulusan-form.html's "Alumni yang
           Dinilai" grid, shown here first so the Perwakilan Perusahaan can confirm who they're
           about to evaluate before the NIM verification challenge below. */
        .verify-id-label { font-size: 0.75rem; font-weight: 600; color: var(--qn-neutral-500); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.75rem; }
        .verify-id-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem 1rem; margin-bottom: 1.5rem; }
        @media (max-width: 30rem) { .verify-id-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="body body_kl-white">
    <!-- Header: logo only - the perusahaan/pengguna lulusan respondent is not a logged-in alumni, so no personal identity is shown -->
    <header class="ts-header">
        <div class="ts-header__inner" style="justify-content: center;">
            <img src="assets/karirlink/images/logo/karirlink-colored.webp" alt="Karirlink" style="height: 2.25rem; object-fit: contain;">
        </div>
    </header>

    <!-- Main Content -->
    <main class="ts-main">
        <div class="card" style="max-width: 46rem; width: 100%;">
            <div class="card__body">
                <!-- Illustration -->
                <svg class="verify-illust" viewBox="0 0 200 155" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="50" y="20" width="100" height="120" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
                    <rect x="65" y="45" width="70" height="8" rx="4" fill="#93C5FD"/>
                    <rect x="65" y="62" width="50" height="6" rx="3" fill="#BFDBFE"/>
                    <rect x="65" y="78" width="70" height="8" rx="4" fill="#93C5FD"/>
                    <rect x="65" y="95" width="40" height="6" rx="3" fill="#BFDBFE"/>
                    <circle cx="100" cy="115" r="12" fill="#3B82F6"/>
                    <path d="M95 115l3 3 7-7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="100" cy="28" r="6" fill="#3B82F6"/>
                </svg>

                <!-- Title & Description -->
                <h2 class="verify-title">Verifikasi Alumni yang Akan Dinilai</h2>
                <p class="verify-desc">Berikut data alumni yang akan Anda nilai. Periksa kembali, lalu lanjutkan untuk mengisi kuesioner.</p>

                <!-- Read-only identity summary - sourced from the invitation link, not typed by
                     the Perwakilan Perusahaan -->
                <p class="verify-id-label">Data Alumni yang Dinilai</p>
                <div class="verify-id-grid">
                    <div class="form-control" style="margin-bottom: 0;">
                        <label class="form-control__label">Nama</label>
                        <div class="form-control__group"><input type="text" class="form-control__input" value="Henni Sendi Sejawa" readonly disabled></div>
                    </div>
                    <div class="form-control" style="margin-bottom: 0;">
                        <label class="form-control__label">NIM</label>
                        <div class="form-control__group"><input type="text" class="form-control__input" value="00000010125" readonly disabled></div>
                    </div>
                    <div class="form-control" style="margin-bottom: 0;">
                        <label class="form-control__label">Program Studi</label>
                        <div class="form-control__group"><input type="text" class="form-control__input" value="S1 - Akuntansi" readonly disabled></div>
                    </div>
                    <div class="form-control" style="margin-bottom: 0;">
                        <label class="form-control__label">Perguruan Tinggi</label>
                        <div class="form-control__group"><input type="text" class="form-control__input" value="Universitas Contoh" readonly disabled></div>
                    </div>
                </div>

                <!-- Form -->
                <form action="./pengguna-lulusan-form.html">
                    <button type="submit" class="btn btn_primary" style="width: 100%;">Verifikasi &amp; Lanjutkan</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer__copyright-wrapper">
            <div class="footer__logo-wrapper">
                <img src="assets/vendors/quantum-v2.2.1-202310260001/assets/images/logos/sevima.png" alt="" class="footer__logo">
            </div>
            <p class="footer__copyright">&copy; 2005-2026 SEVIMA. All Rights Reserved</p>
        </div>
        <p class="footer__brand-name">SEVIMA Platform</p>
    </footer>

    <!-- Quantum JavaScript -->
    <script src="assets/vendors/quantum-v2.2.1-202310260001/assets/release/qn-202310260001.js"></script>

    </script>
</body>
</html>
