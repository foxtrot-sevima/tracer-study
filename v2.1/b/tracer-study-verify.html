<!DOCTYPE html>
<html lang="id">
<head>
    <base href="/v2.1/b/">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Identitas | Pengisian Tracer Study | Karirlink</title>
    <link rel="icon" href="assets/karirlink/images/logo/karirlink-colored-square.webp">

    <!-- Choices CSS & JS -->
    <link rel="stylesheet" href="assets/vendors/quantum-v2.2.1-202310260001/vendors/choices.js-10.2.0/public/assets/styles/choices.min.css">
    <script src="assets/vendors/quantum-v2.2.1-202310260001/vendors/choices.js-10.2.0/public/assets/scripts/choices.min.js"></script>

    <!-- Quantum CSS -->
    <link rel="stylesheet" href="assets/vendors/quantum-v2.2.1-202310260001/assets/release/qn-202310260001.css">

    <!-- Karirlink CSS -->
    <link rel="stylesheet" href="assets/karirlink/css/main.css">
    <link rel="stylesheet" href="assets/css/main.css">

    <style>
        body { background: var(--qn-neutral-100); display: flex; flex-direction: column; min-height: 100vh; }

        /* Public tracer-study branding bar (page-local: no Quantum equivalent for this unauthenticated portal header) */
        .ts-header { position: sticky; top: 0; z-index: 50; background: white; border-bottom: 1px solid var(--qn-neutral-200); padding: 0.75rem 1rem; }
        .ts-header__inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
        .ts-header__left { display: flex; align-items: center; gap: 0.75rem; }
        .ts-header__logo { width: 3rem; height: 3rem; border-radius: 50%; border: 1px solid var(--qn-neutral-200); object-fit: cover; }
        .ts-header__info p { margin: 0; }
        .ts-header__info p:first-child { font-size: 0.875rem; color: var(--qn-neutral-500); }
        .ts-header__info p:last-child { font-weight: 500; color: var(--qn-neutral-800); }

        /* Main */
        .ts-main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 2.5rem 1rem; }

        /* Illustration placeholder (decorative, no Quantum equivalent needed) */
        .verify-illust { display: block; margin: 0 auto 1.5rem; width: 10rem; height: auto; }

        /* Text */
        .verify-title { font-size: 1.125rem; font-weight: 600; color: var(--qn-neutral-800); text-align: center; margin-bottom: 0.5rem; }
        .verify-desc { font-size: 0.875rem; color: var(--qn-neutral-500); text-align: center; line-height: 1.5; margin-bottom: 1.5rem; }

        /* Footer */
    </style>
</head>
<body class="body body_kl-white">
    <!-- Header: logo only - identity is not yet verified at this point, so no personal name/NIM is shown -->
    <header class="ts-header">
        <div class="ts-header__inner" style="justify-content: center;">
            <img src="assets/karirlink/images/logo/karirlink-colored.webp" alt="Karirlink" style="height: 2.25rem; object-fit: contain;">
        </div>
    </header>

    <!-- Main Content -->
    <main class="ts-main">
        <div class="card" style="max-width: 46rem; width: 100%;">
            <div class="card__body">
                <!-- Illustration -->
                <svg class="verify-illust" viewBox="0 0 200 155" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="50" y="20" width="100" height="120" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
                    <rect x="65" y="45" width="70" height="8" rx="4" fill="#93C5FD"/>
                    <rect x="65" y="62" width="50" height="6" rx="3" fill="#BFDBFE"/>
                    <rect x="65" y="78" width="70" height="8" rx="4" fill="#93C5FD"/>
                    <rect x="65" y="95" width="40" height="6" rx="3" fill="#BFDBFE"/>
                    <circle cx="100" cy="115" r="12" fill="#3B82F6"/>
                    <path d="M95 115l3 3 7-7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="100" cy="28" r="6" fill="#3B82F6"/>
                </svg>

                <!-- Title & Description -->
                <h2 class="verify-title">Verifikasi Identitas</h2>
                <p class="verify-desc">Lengkapi data berikut untuk memverifikasi identitas Anda sebelum mengisi Tracer Study.</p>

                <!-- Form -->
                <form action="./riwayat-pengisian.html">
                    <div class="form-control" style="margin-bottom: 1.25rem;">
                        <label class="form-control__label">Perguruan Tinggi<span class="important">*</span></label>
                        <div class="form-control__group">
                            <select class="select-default" required>
                                <option value="" disabled>Pilih perguruan tinggi</option>
                                <option value="universitas-contoh" selected>Universitas Contoh</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-control" style="margin-bottom: 1.25rem;">
                        <label class="form-control__label">Program Studi<span class="important">*</span></label>
                        <div class="form-control__group">
                            <select class="select-default" required>
                                <option value="" disabled>Pilih program studi</option>
                                <option value="ti" selected>S1 - Teknik Informatika</option>
                                <option value="si">S1 - Sistem Informasi</option>
                                <option value="akuntansi">S1 - Akuntansi</option>
                                <option value="manajemen">S1 - Manajemen</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-control" style="margin-bottom: 1.25rem;">
                        <label class="form-control__label">NIM<span class="important">*</span></label>
                        <div class="form-control__group">
                            <input type="text" inputmode="numeric" class="form-control__input" value="00000010122" placeholder="Masukkan NIM Anda" required>
                        </div>
                    </div>
                    <div class="form-control" style="margin-bottom: 1.5rem;">
                        <label class="form-control__label">Tanggal Lahir<span class="important">*</span></label>
                        <div class="form-control__group">
                            <input type="date" class="form-control__input" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn_primary" style="width: 100%;">Verifikasi</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer__copyright-wrapper">
            <div class="footer__logo-wrapper">
                <img src="assets/vendors/quantum-v2.2.1-202310260001/assets/images/logos/sevima.png" alt="" class="footer__logo">
            </div>
            <p class="footer__copyright">&copy; 2005-2026 SEVIMA. All Rights Reserved</p>
        </div>
        <p class="footer__brand-name">SEVIMA Platform</p>
    </footer>

    <!-- Quantum JavaScript -->
    <script src="assets/vendors/quantum-v2.2.1-202310260001/assets/release/qn-202310260001.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.select-default').forEach(el => {
                new Choices(el, { searchEnabled: false, itemSelectText: '', shouldSort: false });
            });
        });
    </script>
</body>
</html>
