<!DOCTYPE html>
<html lang="id">
<head>
    <base href="/v2.1/a/">
    <link rel="icon" href="assets/karirlink/images/logo/karirlink-colored-square.webp">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Perusahaan | KarirLink</title>

    <!-- Quantum CSS -->
    <link rel="stylesheet" href="assets/vendors/quantum-v2.2.1-202310260001/assets/release/qn-202310260001.css">

    <!-- Karirlink CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        /* Layout-only: split-screen auth shell (Quantum has no opinion on this) */
        body.register-body { min-height: 100vh; display: flex; }
        .register-form-side { width: 100%; display: flex; flex-direction: column; justify-content: center; padding: 3rem 2rem; }
        .register-illustration-side { display: none; width: 50%; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--qn-primary-50) 0%, var(--qn-primary-100) 100%); }
        @media (min-width: 992px) {
            .register-form-side { width: 50%; padding: 3rem 4rem; }
            .register-illustration-side { display: flex; }
        }
        .register-password-toggle { position: absolute; top: 50%; right: 0.875rem; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--qn-neutral-400); padding: 0.25rem; }
        .register-password-toggle:hover { color: var(--qn-neutral-600); }
    </style>
</head>
<body class="body body_kl-white register-body">
    <!-- Left Side: Form -->
    <div class="register-form-side">
        <!-- Logo -->
        <div style="margin-bottom: 2rem;">
            <img src="assets/karirlink/images/logo/karirlink-colored-square.webp" height="40" alt="Karirlink Logo">
        </div>

        <!-- Heading -->
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 1.75rem; font-weight: 600; color: var(--qn-neutral-800); margin: 0;">Selamat Datang,</h1>
            <h2 style="font-size: 1.75rem; font-weight: 700; color: var(--qn-primary-500); margin: 0;">PT Foxtrot</h2>
            <p style="font-size: 0.875rem; color: var(--qn-neutral-500); margin-top: 0.75rem;">Masukkan NPWP perusahaan dan buat password baru untuk mulai bergabung</p>
        </div>

        <!-- Form -->
        <form id="registerForm" onsubmit="handleRegister(event)">
            <!-- Email -->
            <div class="form-control" style="margin-bottom: 1.25rem;">
                <label class="form-control__label">Email</label>
                <div class="form-control__group">
                    <input type="email" class="form-control__input" value="ptfoxtrot@yopmail.com" disabled>
                </div>
            </div>

            <!-- NPWP -->
            <div class="form-control" style="margin-bottom: 1.25rem;">
                <label class="form-control__label">NPWP Perusahaan</label>
                <div class="form-control__group">
                    <input type="number" class="form-control__input" placeholder="Masukkan NPWP perusahaan">
                </div>
            </div>

            <!-- Kata Sandi -->
            <div class="form-control" style="margin-bottom: 1.25rem;">
                <label class="form-control__label">Kata Sandi <span style="color: var(--qn-danger-500);">*</span></label>
                <div class="form-control__group" style="position: relative;">
                    <input type="password" id="password" class="form-control__input" placeholder="Masukkan kata sandi" required>
                    <button type="button" class="register-password-toggle" onclick="togglePassword('password', 'eyeIcon1')">
                        <span class="icon icon-eye" id="eyeIcon1"></span>
                    </button>
                </div>
            </div>

            <!-- Ulangi Kata Sandi -->
            <div class="form-control" style="margin-bottom: 1.5rem;">
                <label class="form-control__label">Ulangi Kata Sandi Anda <span style="color: var(--qn-danger-500);">*</span></label>
                <div class="form-control__group" style="position: relative;">
                    <input type="password" id="confirmPassword" class="form-control__input" placeholder="Ulangi kata sandi Anda" required>
                    <button type="button" class="register-password-toggle" onclick="togglePassword('confirmPassword', 'eyeIcon2')">
                        <span class="icon icon-eye" id="eyeIcon2"></span>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn_primary btn_block">Gabung Sekarang</button>
        </form>
    </div>

    <!-- Right Side: Illustration -->
    <div class="register-illustration-side">
        <svg width="280" height="320" viewBox="0 0 280 320" fill="none">
            <circle cx="140" cy="160" r="120" fill="var(--qn-primary-500)" opacity="0.08"/>
            <ellipse cx="140" cy="260" rx="50" ry="30" fill="var(--qn-primary-500)" opacity="0.2"/>
            <rect x="115" y="170" width="50" height="70" rx="10" fill="var(--qn-primary-500)" opacity="0.3"/>
            <circle cx="140" cy="140" r="35" fill="var(--qn-primary-500)" opacity="0.3"/>
            <rect x="90" y="230" width="100" height="8" rx="4" fill="var(--qn-primary-500)" opacity="0.4"/>
            <rect x="100" y="200" width="80" height="30" rx="4" fill="var(--qn-primary-500)" opacity="0.25"/>
            <circle cx="60" cy="100" r="4" fill="var(--qn-primary-500)" opacity="0.2"/>
            <circle cx="220" cy="80" r="6" fill="var(--qn-primary-500)" opacity="0.15"/>
            <circle cx="240" cy="200" r="3" fill="var(--qn-primary-500)" opacity="0.2"/>
            <circle cx="50" cy="220" r="5" fill="var(--qn-primary-500)" opacity="0.15"/>
            <rect x="200" y="120" width="30" height="40" rx="4" fill="var(--qn-primary-500)" opacity="0.2"/>
            <rect x="206" y="130" width="18" height="3" rx="1.5" fill="var(--qn-primary-500)" opacity="0.3"/>
            <rect x="206" y="137" width="14" height="3" rx="1.5" fill="var(--qn-primary-500)" opacity="0.3"/>
            <rect x="206" y="144" width="18" height="3" rx="1.5" fill="var(--qn-primary-500)" opacity="0.3"/>
        </svg>
    </div>

    <!-- Quantum JavaScript -->
    <script src="assets/vendors/quantum-v2.2.1-202310260001/assets/release/qn-202310260001.js"></script>
    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'icon icon-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'icon icon-eye';
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            window.location.href = 'company-onboarding.html';
        }
    </script>
</body>
</html>
