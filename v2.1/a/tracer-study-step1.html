<!DOCTYPE html>
<html lang="id">
<head>
    <base href="/v2.1/a/">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengisian Tracer Study | Karirlink</title>
    <link rel="icon" href="assets/karirlink/images/logo/karirlink-colored-square.webp">

    <!-- Choices CSS & JS -->
    <link rel="stylesheet" href="assets/vendors/quantum-v2.2.1-202310260001/vendors/choices.js-10.2.0/public/assets/styles/choices.min.css">
    <script src="assets/vendors/quantum-v2.2.1-202310260001/vendors/choices.js-10.2.0/public/assets/scripts/choices.min.js"></script>

    <!-- Quantum CSS -->
    <link rel="stylesheet" href="assets/vendors/quantum-v2.2.1-202310260001/assets/release/qn-202310260001.css">

    <!-- Karirlink CSS -->
    <link rel="stylesheet" href="assets/karirlink/css/main.css">
    <link rel="stylesheet" href="assets/css/main.css">

    <style>
        body { background: var(--qn-neutral-100); }

        /* Public tracer-study branding bar (page-local: no Quantum equivalent for this unauthenticated portal header) */
        .ts-header { position: sticky; top: 0; z-index: 50; background: white; border-bottom: 1px solid var(--qn-neutral-200); padding: 0.75rem 1rem; }
        .ts-header__inner { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; }
        .ts-header__left { display: flex; align-items: center; gap: 0.75rem; }
        .ts-header__logo { width: 3rem; height: 3rem; border-radius: 50%; border: 1px solid var(--qn-neutral-200); object-fit: cover; }
        .ts-header__info p { margin: 0; }
        .ts-header__info p:first-child { font-size: 0.875rem; color: var(--qn-neutral-500); }
        .ts-header__info p:last-child { font-weight: 500; color: var(--qn-neutral-800); }

        /* Main — soft brand-tinted backdrop so the card reads as a "hero", not a floating box */
        .ts-main {
            min-height: calc(100vh - 140px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            background:
                radial-gradient(circle at 10% 15%, var(--qn-primary-100) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, var(--qn-primary-100) 0%, transparent 38%);
        }

        /* Hero icon badge above the card title */
        .ts-hero-icon {
            width: 3.75rem; height: 3.75rem; border-radius: 50%;
            margin: 0 auto 1.25rem;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--qn-primary-400), var(--qn-primary-600));
            box-shadow: 0 10px 20px -6px rgba(15, 106, 245, 0.35);
        }
        .ts-hero-icon .icon { color: white; font-size: 1.75rem; }

        /* Card accent strip */
        .ts-hero-card { position: relative; overflow: hidden; }
        .ts-hero-card::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 0.3125rem;
            background: linear-gradient(90deg, var(--qn-primary-400), var(--qn-primary-600));
        }

        /* Progress Steps (page-local: no Quantum stepper component available) */
        .ts-progress { display: flex; align-items: flex-start; justify-content: center; gap: 0; margin-bottom: 2rem; }
        .ts-progress__col { display: flex; flex-direction: column; align-items: center; gap: 0.375rem; width: 5.5rem; }
        .ts-progress__step { width: 2rem; height: 2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; }
        .ts-progress__step--completed { background: var(--qn-success-500); color: white; }
        .ts-progress__step--active { background: var(--qn-primary-500); color: white; box-shadow: 0 0 0 4px var(--qn-primary-100); }
        .ts-progress__step--pending { background: var(--qn-neutral-200); color: var(--qn-neutral-400); }
        .ts-progress__label { font-size: 0.75rem; color: var(--qn-neutral-400); font-weight: 500; text-align: center; }
        .ts-progress__label--active { color: var(--qn-primary-500); font-weight: 600; }
        .ts-progress__line { width: 2rem; height: 2px; background: var(--qn-neutral-200); margin-top: 0.9375rem; }
        .ts-progress__line--completed { background: var(--qn-success-500); }

        /* Footer */
        .ts-footer { background: var(--qn-primary-700); padding: 1rem; text-align: center; }
        .ts-footer p { color: white; font-size: 0.875rem; margin: 0; }
        .ts-footer a { color: white; text-decoration: underline; }
    </style>
</head>
<body class="body body_kl-white">
    <!-- Header -->
    <header class="ts-header">
        <div class="ts-header__inner">
            <div class="ts-header__left">
                <img src="assets/karirlink/images/logo/karirlink-colored-square.webp" alt="Logo" class="ts-header__logo">
                <div class="ts-header__info">
                    <p>Portal Alumni dan Pusat Karir</p>
                    <p>Universitas Contoh</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="ts-main">
        <div class="card ts-hero-card" style="max-width: 46rem; width: 100%;">
            <div class="card__body">
                <!-- Progress Steps -->
                <div class="ts-progress">
                    <div class="ts-progress__col">
                        <div class="ts-progress__step ts-progress__step--active">1</div>
                        <span class="ts-progress__label ts-progress__label--active">Data Diri</span>
                    </div>
                    <div class="ts-progress__line"></div>
                    <div class="ts-progress__col">
                        <div class="ts-progress__step ts-progress__step--pending">2</div>
                        <span class="ts-progress__label">Verifikasi</span>
                    </div>
                </div>

                <div class="ts-hero-icon">
                    <span class="icon icon-academic-cap"></span>
                </div>

                <div class="main__wrapper" style="margin-bottom: 1.5rem; text-align: center;">
                    <h1 class="main__title">Pengisian Tracer Study</h1>
                    <p class="main__subtitle">Silakan lengkapi data berikut untuk melanjutkan pengisian tracer study.</p>
                </div>

                <form action="./tracer-study-step2.html">
                    <div class="form-control">
                        <label class="form-control__label">Tahun Lulus<span class="important">*</span></label>
                        <div class="form-control__group">
                            <select class="select-default" id="ts1-tahun" required>
                                <option value="" disabled selected>Pilih tahun lulus</option>
                                <option value="2026">2026</option>
                                <option value="2025">2025</option>
                                <option value="2024">2024</option>
                                <option value="2023">2023</option>
                                <option value="2022">2022</option>
                                <option value="2021">2021</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-control">
                        <label class="form-control__label">Jenjang Pendidikan<span class="important">*</span></label>
                        <div class="form-control__group">
                            <select class="select-default" id="ts1-jenjang" required>
                                <option value="" disabled selected>Pilih jenjang pendidikan</option>
                                <option value="D3">D3</option>
                                <option value="D4">D4</option>
                                <option value="S1">S1</option>
                                <option value="S2">S2</option>
                                <option value="S3">S3</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-control" style="margin-bottom: 1.5rem;">
                        <label class="form-control__label">Program Studi<span class="important">*</span></label>
                        <div class="form-control__group">
                            <select class="select-default" id="ts1-prodi" required>
                                <option value="" disabled selected>Pilih program studi</option>
                                <option value="ti">S1 - Teknik Informatika</option>
                                <option value="si">S1 - Sistem Informasi</option>
                                <option value="akuntansi">S1 - Akuntansi</option>
                                <option value="manajemen">S1 - Manajemen</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn_primary" style="width: 100%;">
                        Lanjutkan
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="ts-footer">
        <p>© 2026 <a href="https://sevima.com">SEVIMA</a> All Right Reserved, Powered by <a href="https://karirlink.id">Karirlink</a></p>
    </footer>

    <!-- Quantum JavaScript -->
    <script src="assets/vendors/quantum-v2.2.1-202310260001/assets/release/qn-202310260001.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.select-default').forEach(el => {
                new Choices(el, { searchEnabled: false, itemSelectText: '', shouldSort: false });
            });
        });
    </script>
</body>
</html>
