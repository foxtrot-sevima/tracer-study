<!DOCTYPE html>
<html lang="id">
<head>
    <base href="/v2/">
    <link rel="icon" href="assets/karirlink/images/logo/karirlink-colored-square.webp">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding Perusahaan | KarirLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        primary50: "#EAEDF5", primary100: "#D4DBEB", primary200: "#A9B7D7",
                        primary300: "#7F92C2", primary400: "#546EAE", primary500: "#294A9A",
                        primary600: '#1F3874', primary700: "#15254D", primary800: "#0A1327",
                        bgprimary: "#F6F8FF"
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, #15254D 0%, #294A9A 50%, #1F3874 100%);">

    <!-- Main Card -->
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-8 md:p-10 relative">
        <!-- Header: Logo + Lewati -->
        <div class="flex items-center justify-between mb-8">
            <img src="assets/karirlink/images/logo/karirlink-colored-square.webp" class="h-9 w-9 rounded" alt="Karirlink Logo">
            <a href="./company-beranda.html" class="text-sm text-gray-500 hover:text-primary500 font-medium">Lewati</a>
        </div>

        <!-- Progress Bar -->
        <div class="mb-2">
            <div class="w-full bg-gray-200 rounded-full h-2">
                <div id="progressBar" class="h-2 rounded-full transition-all duration-500" style="width: 33.33%; background-color: #294A9A;"></div>
            </div>
        </div>

        <!-- Step Indicator -->
        <div class="flex justify-end mb-6">
            <span id="stepIndicator" class="text-sm text-gray-500 font-medium">1/3</span>
        </div>

        <!-- Step 1 -->
        <div id="step1" class="step-content">
            <h2 class="text-lg md:text-xl font-semibold text-gray-800 mb-6">
                Lengkapi data lokasi, alamat, dan website agar tampil dan dapat dilihat oleh perguruan tinggi dan mahasiswa
            </h2>

            <div class="space-y-5">
                <!-- Lokasi -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-600">Lokasi <span class="text-red-500">*</span></label>
                    <select required class="w-full py-3.5 px-4 text-sm text-gray-900 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary500 focus:border-primary500">
                        <option value="" disabled selected>Pilih lokasi</option>
                        <option>Jakarta</option>
                        <option>Surabaya</option>
                        <option>Bandung</option>
                        <option>Semarang</option>
                        <option>Yogyakarta</option>
                        <option>Malang</option>
                        <option>Medan</option>
                        <option>Makassar</option>
                    </select>
                </div>

                <!-- Alamat Lengkap -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-600">Alamat Lengkap <span class="text-red-500">*</span></label>
                    <textarea rows="3" placeholder="Masukkan alamat lengkap perusahaan" required
                        class="w-full py-3.5 px-4 text-sm text-gray-900 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary500 focus:border-primary500 placeholder-gray-400 resize-none"></textarea>
                </div>

                <!-- Website -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-600">Website</label>
                    <input type="text" placeholder="https://www.perusahaan.com"
                        class="w-full py-3.5 px-4 text-sm text-gray-900 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary500 focus:border-primary500 placeholder-gray-400">
                </div>

                <!-- Email -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-600">Email <span class="text-red-500">*</span></label>
                    <input type="email" value="ptfoxtrot@yopmail.com" disabled
                        class="w-full py-3.5 px-4 text-sm text-gray-500 bg-gray-100 border border-gray-300 rounded-lg cursor-not-allowed">
                </div>
            </div>
        </div>

        <!-- Step 2 -->
        <div id="step2" class="step-content hidden">
            <h2 class="text-lg md:text-xl font-semibold text-gray-800 mb-6">
                Ceritakan profil perusahaan Anda!
            </h2>

            <div class="space-y-5">
                <!-- Tipe Industri -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-600">Tipe Industri <span class="text-red-500">*</span></label>
                    <select required class="w-full py-3.5 px-4 text-sm text-gray-900 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary500 focus:border-primary500">
                        <option value="" disabled selected>Pilih tipe industri</option>
                        <option>Advertising</option>
                        <option>Agrikultural/Perkebunan/Peternakan Unggas/Perikanan</option>
                        <option>Call Center/IT-Enabled Services/BPO</option>
                        <option>Elektrikal & Elektronik</option>
                        <option>Hiburan/Media</option>
                        <option>Hotel/Pariwisata</option>
                        <option>Hukum/Legal</option>
                        <option>Ilmu Pengetahuan & Teknologi</option>
                        <option>Industri Berat/Mesin/Peralatan</option>
                    </select>
                </div>

                <!-- Ukuran Perusahaan -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-600">Ukuran Perusahaan <span class="text-red-500">*</span></label>
                    <select required class="w-full py-3.5 px-4 text-sm text-gray-900 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary500 focus:border-primary500">
                        <option value="" disabled selected>Pilih ukuran perusahaan</option>
                        <option>Kecil &lt;200 pegawai</option>
                        <option>Sedang 200 s/d 1000 pegawai</option>
                        <option>Besar &gt;1000 pegawai</option>
                    </select>
                </div>

                <!-- Deskripsi -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-600">Deskripsi <span class="text-red-500">*</span></label>
                    <textarea rows="3" placeholder="Ceritakan tentang perusahaan Anda" required
                        class="w-full py-3.5 px-4 text-sm text-gray-900 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary500 focus:border-primary500 placeholder-gray-400 resize-none"></textarea>
                </div>

                <!-- Benefit -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-600">Benefit <span class="text-red-500">*</span></label>
                    <input type="text" placeholder="Contoh: BPJS, Tunjangan Makan, dll" required
                        class="w-full py-3.5 px-4 text-sm text-gray-900 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary500 focus:border-primary500 placeholder-gray-400">
                </div>

                <!-- Tagline -->
                <div>
                    <label class="block mb-2 text-sm font-medium text-gray-600">Tagline</label>
                    <input type="text" placeholder="Contoh: Revolutionize Education!"
                        class="w-full py-3.5 px-4 text-sm text-gray-900 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary500 focus:border-primary500 placeholder-gray-400">
                </div>
            </div>
        </div>

        <!-- Step 3 -->
        <div id="step3" class="step-content hidden">
            <h2 class="text-lg md:text-xl font-semibold text-gray-800 mb-6">
                Hampir selesai, tambahkan logo perusahaan Anda! <span class="text-red-500">*</span>
            </h2>

            <div class="mb-6">
                <!-- Upload Area -->
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-12 flex flex-col items-center justify-center cursor-pointer hover:border-primary500 hover:bg-primary50 transition"
                     onclick="document.getElementById('fileInput').click()">
                    <svg class="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <p class="text-sm text-gray-500 text-center">Tambahkan file dengan cara klik kotak ini</p>
                    <p class="text-xs text-gray-400 mt-2">Format: JPG, PNG (Maks. 2MB)</p>
                </div>
                <input type="file" id="fileInput" class="hidden" accept="image/*">
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex items-center justify-between mt-8">
            <button id="btnBack" onclick="prevStep()" class="hidden text-sm font-medium text-gray-600 hover:text-primary500 flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                Kembali
            </button>
            <div id="btnBackPlaceholder"></div>

            <button id="btnNext" onclick="nextStep()"
                class="px-8 py-3 text-sm font-semibold text-white rounded-lg hover:opacity-90 transition focus:outline-none focus:ring-4 focus:ring-primary200"
                style="background-color: #294A9A;">
                Selanjutnya
            </button>
        </div>
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 3;

        function updateUI() {
            // Hide all steps
            document.querySelectorAll('.step-content').forEach(el => el.classList.add('hidden'));
            // Show current step
            document.getElementById('step' + currentStep).classList.remove('hidden');

            // Update progress bar
            const progress = (currentStep / totalSteps) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            // Update step indicator
            document.getElementById('stepIndicator').textContent = currentStep + '/' + totalSteps;

            // Back button visibility
            const btnBack = document.getElementById('btnBack');
            const btnBackPlaceholder = document.getElementById('btnBackPlaceholder');
            if (currentStep === 1) {
                btnBack.classList.add('hidden');
                btnBackPlaceholder.classList.remove('hidden');
            } else {
                btnBack.classList.remove('hidden');
                btnBackPlaceholder.classList.add('hidden');
            }

            // Next button text
            const btnNext = document.getElementById('btnNext');
            if (currentStep === totalSteps) {
                btnNext.textContent = 'Simpan';
            } else {
                btnNext.textContent = 'Selanjutnya';
            }
        }

        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateUI();
            } else {
                // Final step - redirect
                window.location.href = 'company-beranda.html';
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                updateUI();
            }
        }

        // Initialize
        updateUI();
    </script>
</body>
</html>
