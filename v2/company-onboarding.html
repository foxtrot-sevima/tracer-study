<!DOCTYPE html>
<html lang="id">
<head>
    <base href="/v2/">
    <link rel="icon" href="assets/karirlink/images/logo/karirlink-colored-square.webp">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding Perusahaan | KarirLink</title>

    <!-- Choices CSS & JS -->
    <link rel="stylesheet" href="assets/vendors/quantum-v2.2.1-202310260001/vendors/choices.js-10.2.0/public/assets/styles/choices.min.css">
    <script src="assets/vendors/quantum-v2.2.1-202310260001/vendors/choices.js-10.2.0/public/assets/scripts/choices.min.js"></script>

    <!-- Quantum CSS -->
    <link rel="stylesheet" href="assets/vendors/quantum-v2.2.1-202310260001/assets/release/qn-202310260001.css">

    <!-- Karirlink CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        /* Layout-only: full-screen gradient auth wizard shell (Quantum has no opinion on this) */
        body.onboarding-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: linear-gradient(135deg, #15254D 0%, #294A9A 50%, #1F3874 100%);
        }
        .onboarding-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 40rem;
            padding: 2rem;
        }
        .onboarding-card__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
        .onboarding-progress { width: 100%; background: var(--qn-neutral-200); border-radius: 9999px; height: 0.5rem; margin-bottom: 0.5rem; }
        .onboarding-progress__bar { height: 0.5rem; border-radius: 9999px; background: var(--qn-primary-500); transition: width 0.4s ease; }
        .onboarding-step-indicator { text-align: right; font-size: 0.875rem; color: var(--qn-neutral-500); margin-bottom: 1.5rem; }
        .onboarding-step__title { font-size: 1.125rem; font-weight: 600; color: var(--qn-neutral-800); margin: 0 0 1.5rem; }
        .onboarding-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 2rem; }
        .upload-card {
            border: 2px dashed var(--qn-primary-300);
            border-radius: 0.75rem;
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .upload-card:hover { border-color: var(--qn-primary-500); background: var(--qn-primary-50); }
        .upload-card__icon { font-size: 3rem; color: var(--qn-neutral-300); margin-bottom: 1rem; }
    </style>
</head>
<body class="body body_kl-white onboarding-body">

    <!-- Onboarding Card -->
    <div class="onboarding-card">
        <!-- Header: Logo + Lewati -->
        <div class="onboarding-card__header">
            <img src="assets/karirlink/images/logo/karirlink-colored-square.webp" height="36" alt="Karirlink Logo">
            <a href="./company-beranda.html" class="link link_primary">Lewati</a>
        </div>

        <!-- Progress Bar -->
        <div class="onboarding-progress">
            <div id="progressBar" class="onboarding-progress__bar" style="width: 33.33%;"></div>
        </div>
        <p class="onboarding-step-indicator" id="stepIndicator">1/3</p>

        <!-- Step 1 -->
        <div id="step1" class="step-content">
            <h2 class="onboarding-step__title">Lengkapi data lokasi, alamat, dan website agar tampil dan dapat dilihat oleh perguruan tinggi dan mahasiswa</h2>

            <div class="form-control" style="margin-bottom: 1.25rem;">
                <label class="form-control__label">Lokasi <span style="color: var(--qn-danger-500);">*</span></label>
                <select class="select-default" id="ob-lokasi" required>
                    <option value="" disabled selected>Pilih lokasi</option>
                    <option>Jakarta</option>
                    <option>Surabaya</option>
                    <option>Bandung</option>
                    <option>Semarang</option>
                    <option>Yogyakarta</option>
                    <option>Malang</option>
                    <option>Medan</option>
                    <option>Makassar</option>
                </select>
            </div>

            <div class="form-control" style="margin-bottom: 1.25rem;">
                <label class="form-control__label">Alamat Lengkap <span style="color: var(--qn-danger-500);">*</span></label>
                <div class="form-control__group">
                    <textarea class="form-control__input" rows="3" placeholder="Masukkan alamat lengkap perusahaan" required></textarea>
                </div>
            </div>

            <div class="form-control" style="margin-bottom: 1.25rem;">
                <label class="form-control__label">Website</label>
                <div class="form-control__group">
                    <input type="text" class="form-control__input" placeholder="https://www.perusahaan.com">
                </div>
            </div>

            <div class="form-control">
                <label class="form-control__label">Email <span style="color: var(--qn-danger-500);">*</span></label>
                <div class="form-control__group">
                    <input type="email" class="form-control__input" value="ptfoxtrot@yopmail.com" disabled>
                </div>
            </div>
        </div>

        <!-- Step 2 -->
        <div id="step2" class="step-content" style="display: none;">
            <h2 class="onboarding-step__title">Ceritakan profil perusahaan Anda!</h2>

            <div class="form-control" style="margin-bottom: 1.25rem;">
                <label class="form-control__label">Tipe Industri <span style="color: var(--qn-danger-500);">*</span></label>
                <select class="select-default" id="ob-industri" required>
                    <option value="" disabled selected>Pilih tipe industri</option>
                    <option>Advertising</option>
                    <option>Agrikultural/Perkebunan/Peternakan Unggas/Perikanan</option>
                    <option>Call Center/IT-Enabled Services/BPO</option>
                    <option>Elektrikal &amp; Elektronik</option>
                    <option>Hiburan/Media</option>
                    <option>Hotel/Pariwisata</option>
                    <option>Hukum/Legal</option>
                    <option>Ilmu Pengetahuan &amp; Teknologi</option>
                    <option>Industri Berat/Mesin/Peralatan</option>
                </select>
            </div>

            <div class="form-control" style="margin-bottom: 1.25rem;">
                <label class="form-control__label">Ukuran Perusahaan <span style="color: var(--qn-danger-500);">*</span></label>
                <select class="select-default" id="ob-ukuran" required>
                    <option value="" disabled selected>Pilih ukuran perusahaan</option>
                    <option>Kecil &lt;200 pegawai</option>
                    <option>Sedang 200 s/d 1000 pegawai</option>
                    <option>Besar &gt;1000 pegawai</option>
                </select>
            </div>

            <div class="form-control" style="margin-bottom: 1.25rem;">
                <label class="form-control__label">Deskripsi <span style="color: var(--qn-danger-500);">*</span></label>
                <div class="form-control__group">
                    <textarea class="form-control__input" rows="3" placeholder="Ceritakan tentang perusahaan Anda" required></textarea>
                </div>
            </div>

            <div class="form-control" style="margin-bottom: 1.25rem;">
                <label class="form-control__label">Benefit <span style="color: var(--qn-danger-500);">*</span></label>
                <div class="form-control__group">
                    <input type="text" class="form-control__input" placeholder="Contoh: BPJS, Tunjangan Makan, dll" required>
                </div>
            </div>

            <div class="form-control">
                <label class="form-control__label">Tagline</label>
                <div class="form-control__group">
                    <input type="text" class="form-control__input" placeholder="Contoh: Revolutionize Education!">
                </div>
            </div>
        </div>

        <!-- Step 3 -->
        <div id="step3" class="step-content" style="display: none;">
            <h2 class="onboarding-step__title">Hampir selesai, tambahkan logo perusahaan Anda! <span style="color: var(--qn-danger-500);">*</span></h2>

            <div class="upload-card" onclick="document.getElementById('fileInput').click()">
                <span class="icon icon-arrow-up-on-square upload-card__icon"></span>
                <p style="font-size: 0.875rem; color: var(--qn-neutral-500); margin: 0;">Tambahkan file dengan cara klik kotak ini</p>
                <p style="font-size: 0.75rem; color: var(--qn-neutral-400); margin: 0.5rem 0 0;">Format: JPG, PNG (Maks. 2MB)</p>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="onboarding-nav">
            <button id="btnBack" onclick="prevStep()" class="btn btn_outline" style="display: none;">
                <span class="icon icon-arrow-left-mini"></span>
                <span class="btn__text">Kembali</span>
            </button>
            <div id="btnBackPlaceholder"></div>

            <button id="btnNext" onclick="nextStep()" class="btn btn_primary">
                <span class="btn__text">Selanjutnya</span>
            </button>
        </div>
    </div>

    <!-- Quantum JavaScript -->
    <script src="assets/vendors/quantum-v2.2.1-202310260001/assets/release/qn-202310260001.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.select-default').forEach(el => {
                new Choices(el, { searchEnabled: false, itemSelectText: '', shouldSort: false });
            });
        });

        let currentStep = 1;
        const totalSteps = 3;

        function updateUI() {
            document.querySelectorAll('.step-content').forEach(el => el.style.display = 'none');
            document.getElementById('step' + currentStep).style.display = 'block';

            const progress = (currentStep / totalSteps) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('stepIndicator').textContent = currentStep + '/' + totalSteps;

            const btnBack = document.getElementById('btnBack');
            const btnBackPlaceholder = document.getElementById('btnBackPlaceholder');
            if (currentStep === 1) {
                btnBack.style.display = 'none';
                btnBackPlaceholder.style.display = 'block';
            } else {
                btnBack.style.display = 'inline-flex';
                btnBackPlaceholder.style.display = 'none';
            }

            const btnNext = document.getElementById('btnNext');
            btnNext.querySelector('.btn__text').textContent = currentStep === totalSteps ? 'Simpan' : 'Selanjutnya';
        }

        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateUI();
            } else {
                window.location.href = 'company-beranda.html';
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
